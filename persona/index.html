            <div style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, color: run.delta > 0 ? '#ff4d2c' : '#3fb069', fontVariantNumeric: 'tabular-nums', marginBottom: 8 }}>{run.delta > 0 ? '+' : ''}{run.delta} vs prev</div>
            <div style={{ fontSize: 11, color: '#707070', letterSpacing: '-0.005em', marginBottom: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{run.url}</div>
            <div style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, color: '#a8a8a8', letterSpacing: '-0.36px' }}>{run.date} · {run.personas}体</div>
          </div>);
          })()}
      </div>

      {/* ② Key metrics */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 16 }}>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 14 }}>指標比較</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5,1fr)', gap: 0 }}>
          {METRICS.map((m, i) => {
              const numA = typeof m.valA === 'number' ? m.valA : null;
              const numB = typeof m.valB === 'number' ? m.valB : null;
              const dc = numA !== null && numB !== null ? diffColor(numA, numB, m.lowerBetter) : '#707070';
              const delta = numA !== null && numB !== null ? m.lowerBetter ? numA - numB : numB - numA : null;
              return (
                <div key={m.label} style={{ borderRight: i < 4 ? '1px solid #f7f7f7' : 'none', padding: '0 14px 0', textAlign: 'center' }}>
                <div style={{ fontSize: 10, color: '#707070', letterSpacing: '-0.005em', marginBottom: 8, lineHeight: 1.3 }}>{m.label}</div>
                <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 6 }}>
                  <span style={{ ...mono, fontSize: 15, fontWeight: 500, color: '#a8a8a8', fontVariantNumeric: 'tabular-nums' }}>{m.valA}{m.unit}</span>
                  <span style={{ ...mono, fontSize: 11, color: '#d4d4d4', alignSelf: 'center' }}>→</span>
                  <span style={{ ...mono, fontSize: 15, fontWeight: 500, color: dc, fontVariantNumeric: 'tabular-nums' }}>{m.valB}{m.unit}</span>
                </div>
                {delta !== null && <span style={{ ...mono, fontSize: 10, color: dc, fontVariantNumeric: 'tabular-nums' }}>{delta > 0 ? '+' : ''}{delta}{m.unit}</span>}
              </div>);

            })}
        </div>
      </div>

      {/* ③ Journey Diff Map */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 16, overflowX: 'auto' }}>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 14 }}>ジャーニー差分マップ</div>
        <div style={{ display: 'flex', gap: 4, marginBottom: 10, flexShrink: 0 }}>
          <div style={{ ...mono, fontSize: 9, color: '#a8a8a8', letterSpacing: '-0.36px', width: 70, flexShrink: 0 }} />
          {AB_JOURNEY.map((j) =>
            <div key={j.step} style={{ flex: 1, textAlign: 'center', minWidth: 70 }}>
              <span style={{ fontSize: 10, fontWeight: 500, color: '#1a1a1a', letterSpacing: '-0.005em' }}>{j.step}</span>
            </div>
            )}
        </div>
        {/* Reach rates */}
        {[{ label: '到達率', keyA: 'reachA', keyB: 'reachB', max: 100, lowerBetter: false }, { label: '停滞率', keyA: 'stuckA', keyB: 'stuckB', max: 50, lowerBetter: true }].map((row) =>
          <div key={row.label} style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 10 }}>
            <div style={{ ...mono, fontSize: 9, color: '#a8a8a8', letterSpacing: '-0.36px', width: 70, flexShrink: 0 }}>{row.label}</div>
            {AB_JOURNEY.map((j) => {
              const vA = j[row.keyA],vB = j[row.keyB];
              const diff = row.lowerBetter ? vA - vB : vB - vA;
              const isImproved = diff > 0,isWorsened = diff < 0;
              const dc = isImproved ? '#3fb069' : isWorsened ? '#ff4d2c' : '#a8a8a8';
              return (
                <div key={j.step} style={{ flex: 1, minWidth: 70, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                  <div style={{ display: 'flex', gap: 3, alignItems: 'flex-end', height: 28 }}>
                    <div title={`A: ${vA}%`} style={{ width: 10, height: `${vA / row.max * 100}%`, background: '#d4d4d4', borderRadius: '2px 2px 0 0', minHeight: 2 }} />
                    <div title={`B: ${vB}%`} style={{ width: 10, height: `${vB / row.max * 100}%`, background: isImproved ? '#3fb069' : isWorsened ? '#ff4d2c' : '#707070', borderRadius: '2px 2px 0 0', minHeight: 2 }} />
                  </div>
                  <span style={{ ...mono, fontSize: 8, color: dc, fontVariantNumeric: 'tabular-nums' }}>
                    {diff > 0 ? '+' : ''}{diff}%
                  </span>
                </div>);

            })}
          </div>
          )}
        <div style={{ display: 'flex', gap: 12, marginTop: 6 }}>
          {[{ c: '#d4d4d4', l: 'Pattern A' }, { c: '#3fb069', l: '改善' }, { c: '#ff4d2c', l: '悪化' }, { c: '#707070', l: '変化なし' }].map((lg) =>
            <div key={lg.l} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <div style={{ width: 8, height: 8, borderRadius: 1, background: lg.c }} />
              <span style={{ ...mono, fontSize: 9, color: '#a8a8a8', letterSpacing: '-0.3px' }}>{lg.l}</span>
            </div>
            )}
        </div>
      </div>

      {/* ④ Issue classification */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 16 }}>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 14 }}>課題分類</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {AB_ISSUES.map((iss, i) =>
            <div key={i} style={{ border: `1px solid ${iss.color === '#ff4d2c' ? 'rgba(255,77,44,.3)' : iss.color === '#3fb069' ? 'rgba(63,176,105,.3)' : '#e8e8e8'}`,

              <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 6 }}>
                <span style={{ ...mono, fontSize: 10, fontWeight: 500, color: iss.color, letterSpacing: '-0.36px' }}>{iss.cat}</span>
              </div>
              <div style={{ fontSize: 12, fontWeight: 600, color: '#1a1a1a', letterSpacing: '-0.005em', marginBottom: 4 }}>{iss.label}</div>
              <div style={{ fontSize: 11, color: '#707070', lineHeight: 1.5, letterSpacing: '-0.005em' }}>{iss.detail}</div>
            </div>
            )}
        </div>
      </div>

      {/* ⑤ Heatmap A/B/Diff */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px' }}>ヒートマップ比較</div>
          <div style={{ display: 'flex', gap: 4, background: '#f7f7f7', borderRadius: 500, padding: 3 }}>
            {['A', 'B', '差分'].map((m) =>
              <button key={m} onClick={() => setHeatmapMode(m === '差分' ? 'diff' : m)}
              style={{ ...mono, fontSize: 10, fontWeight: 500, padding: '4px 12px', borderRadius: 500, border: 'none', cursor: 'pointer',
                background: heatmapMode === (m === '差分' ? 'diff' : m) ? '#1a1a1a' : 'transparent',
                color: heatmapMode === (m === '差分' ? 'diff' : m) ? '#fff' : '#707070', transition: 'all 200ms' }}>
                PATTERN {m}
              </button>
              )}
          </div>
        </div>
        <div style={{ position: 'relative', border: '1px solid #e8e8e8', borderRadius: 8, overflow: 'hidden', background: '#fafafa', minHeight: 200 }}>
          <div style={{ background: '#fff', borderBottom: '1px solid #e8e8e8', padding: '8px 12px', display: 'flex', gap: 6 }}>
            <div style={{ width: 14, height: 14, borderRadius: 3, background: '#e8e8e8' }} />
            <div style={{ width: 60, height: 7, borderRadius: 3, background: '#e8e8e8', alignSelf: 'center' }} />
          </div>
          <div style={{ display: 'flex', minHeight: 160 }}>
            <div style={{ width: '48%', background: '#f0f0f0', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ width: 80, height: 100, background: '#e0e0e0', borderRadius: 6 }} />
            </div>
            <div style={{ width: '52%', padding: '14px', display: 'flex', flexDirection: 'column', gap: 7, background: '#fff' }}>
              <div style={{ width: '80%', height: 8, background: '#e8e8e8', borderRadius: 3 }} />
              <div style={{ width: '60%', height: 7, background: '#f0f0f0', borderRadius: 3 }} />
              <div style={{ width: '92%', height: 30, borderRadius: 500, background: '#e8e8e8', marginTop: 6 }} />
              <div style={{ width: '92%', height: 22, borderRadius: 500, background: '#f7f7f7', border: '1px solid #e8e8e8' }} />
            </div>
          </div>
          {/* Heat overlays */}
          {zones.map((z, i) =>
            <div key={i} style={{ position: 'absolute', left: z.x, top: z.y, width: z.w, height: z.h, pointerEvents: 'none',
              background: z.improved ? 'rgba(63,176,105,.3)' : z.worsened ? 'rgba(255,77,44,.12)' : `rgba(255,77,44,${z.intensity || 0.1})`,
              borderRadius: 4, border: z.border ? z.improved ? '1px dashed rgba(63,176,105,.5)' : '1px dashed rgba(255,77,44,.5)' : 'none' }} />
            )}
          <div style={{ position: 'absolute', bottom: 6, right: 8, display: 'flex', gap: 4, alignItems: 'center' }}>
            {heatmapMode === 'diff' ?
              [{ c: 'rgba(63,176,105,.3)', l: '改善' }, { c: 'rgba(255,77,44,.12)', l: '悪化' }].map((o) => <React.Fragment key={o.l}><div style={{ width: 10, height: 10, borderRadius: 2, background: o.c }} /><span style={{ ...mono, fontSize: 8, color: '#707070' }}>{o.l}</span></React.Fragment>) :
              [.08, .25, .45, .6].map((o) => <div key={o} style={{ width: 11, height: 11, borderRadius: 2, background: `rgba(255,77,44,${o})` }} />)
              }
          </div>
        </div>
      </div>

      {/* ⑥ Persona attribute breakdown */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 16 }}>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 14 }}>ペルソナ属性ごとの変化</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'auto auto auto auto', gap: '0 0' }}>
          {['属性', 'スコア差分', '完了率変化', '備考'].map((h) =>
            <div key={h} style={{ ...mono, fontSize: 9, color: '#a8a8a8', letterSpacing: '-0.36px', padding: '6px 12px', borderBottom: '1px solid #e8e8e8' }}>{h}</div>
            )}
          {AB_PERSONA.map((p, i) => [
            <div key={`l${i}`} style={{ fontSize: 11, color: '#1a1a1a', letterSpacing: '-0.005em', padding: '10px 12px', borderBottom: '1px solid #f7f7f7' }}>{p.label}</div>,
            <div key={`s${i}`} style={{ ...mono, fontSize: 11, fontWeight: 500, color: '#3fb069', fontVariantNumeric: 'tabular-nums', padding: '10px 12px', borderBottom: '1px solid #f7f7f7' }}>{p.diffScore}</div>,
            <div key={`d${i}`} style={{ ...mono, fontSize: 11, color: '#3fb069', fontVariantNumeric: 'tabular-nums', padding: '10px 12px', borderBottom: '1px solid #f7f7f7' }}>{p.diffDone}</div>,
            <div key={`n${i}`} style={{ fontSize: 11, color: '#a8a8a8', letterSpacing: '-0.005em', padding: '10px 12px', borderBottom: '1px solid #f7f7f7' }}>{p.note}</div>]
            )}
        </div>
      </div>

      {/* ⑦ AI Summary + suggestions */}
      <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '16px 20px', marginBottom: 4 }}>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 12 }}>AI 比較サマリー</div>
        <div style={{ fontSize: 13, color: '#1a1a1a', lineHeight: 1.7, letterSpacing: '-0.005em', marginBottom: 16 }}>
          B（{b.run}）はカートボタンの sticky 固定により完了率が <strong>+22%</strong> 改善し、Confusion Score が <strong>{a.score - b.score} 点</strong> 低下しました。
          一方でギフト設定 UI の再設計が逆効果となり、新規停滞が発生しています。
          50 代以上・IT リテラシー低層への改善余地が最も大きく残っています。
        </div>
        <div style={{ ...mono, fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 12 }}>次の改善候補</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {AB_SUGGESTIONS.map((s, i) =>
            <div key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '12px 14px',
              border: '1px solid #e8e8e8', borderRadius: 10, background: '#fff' }}>
              <span style={{ ...mono, fontSize: 10, fontWeight: 500, background: '#1a1a1a', color: '#fff', padding: '2px 6px', borderRadius: 3, letterSpacing: '-0.36px', flexShrink: 0 }}>{s.rank}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: '#1a1a1a', letterSpacing: '-0.005em', marginBottom: 3 }}>{s.label}</div>
                <div style={{ fontSize: 11, color: '#707070', lineHeight: 1.5, letterSpacing: '-0.005em' }}>{s.detail}</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4, flexShrink: 0 }}>
                <span style={{ ...mono, fontSize: 10, color: '#3fb069', letterSpacing: '-0.36px' }}>{s.impact}</span>
                <span style={{ ...mono, fontSize: 9, color: '#a8a8a8', letterSpacing: '-0.36px' }}>工数 {s.effort}</span>
              </div>
            </div>
            )}
        </div>
      </div>
      </div>
    </div>);

}

/* ─── REPORTS VIEW ─── */
function ReportsView({ onOpen, onNew }) {
  const [selected, setSelected] = useState([]);
  const [comparing, setComparing] = useState(false);

  const toggleSelect = (run) => {
    setSelected((prev) => prev.includes(run) ? prev.filter((r) => r !== run) : prev.length < 2 ? [...prev, run] : [prev[1], run]);
  };

  const compareRuns = REPORTS.filter((r) => selected.includes(r.run));

  if (comparing && compareRuns.length === 2) {
    return <ABCompareDetail a={compareRuns[0]} b={compareRuns[1]} onBack={() => setComparing(false)} />;
  }

  return (
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
      <div style={{ flex: 1, overflowY: 'auto', padding: '32px 40px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 28 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 600, color: '#1a1a1a', letterSpacing: '-0.01em', marginBottom: 4 }}>Past reports</div>
            <div style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, color: '#a8a8a8', letterSpacing: '-0.36px' }}>{REPORTS.length} runs</div>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            {selected.length === 2 &&
            <button onClick={() => setComparing(true)}
            style={{ background: '#f7f7f7', color: '#1a1a1a', border: '1px solid #e8e8e8', borderRadius: 500, padding: '9px 20px', fontSize: 12, fontWeight: 500, letterSpacing: '-0.26px', cursor: 'pointer', transition: 'border-color 200ms' }}
            onMouseEnter={(e) => e.currentTarget.style.borderColor = '#d4d4d4'}
            onMouseLeave={(e) => e.currentTarget.style.borderColor = '#e8e8e8'}>
                A/B 比較
              </button>
            }
            {selected.length > 0 &&
            <span style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, color: '#707070', letterSpacing: '-0.36px' }}>{selected.length}/2 選択中</span>
            }
            <button onClick={onNew} style={{ background: '#1a1a1a', color: '#fff', border: 'none', borderRadius: 500, padding: '10px 24px', fontSize: 13, fontWeight: 500, letterSpacing: '-0.26px', cursor: 'pointer' }}>
              ＋ 新しい検証
            </button>
          </div>
        </div>
        {/* Table header */}
        <div style={{ display: 'grid', gridTemplateColumns: '28px 80px 1fr 100px 80px 80px 70px', gap: '0 14px', padding: '8px 16px', borderBottom: '1px solid #e8e8e8', marginBottom: 4 }}>
          <div />
          {['RUN', 'URL', 'DATE', 'SCORE', 'DELTA', 'PERSONA'].map((h) =>
          <div key={h} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px' }}>{h}</div>
          )}
        </div>
        {/* Rows */}
        {REPORTS.map((r) => {
          const isSel = selected.includes(r.run);
          return (
            <div key={r.run}
            style={{ display: 'grid', gridTemplateColumns: '28px 80px 1fr 100px 80px 80px 70px', gap: '0 14px',
              padding: '12px 16px', borderBottom: '1px solid #f7f7f7', cursor: 'pointer', borderRadius: 8,
              background: isSel ? '#fafafa' : 'transparent', transition: 'background 200ms ease-out' }}
            onMouseEnter={(e) => {if (!isSel) e.currentTarget.style.background = '#f7f7f7';}}
            onMouseLeave={(e) => {if (!isSel) e.currentTarget.style.background = 'transparent';}}>
              {/* Checkbox */}
              <div onClick={() => toggleSelect(r.run)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ width: 16, height: 16, borderRadius: 4, border: `1.5px solid ${isSel ? '#1a1a1a' : '#d4d4d4'}`, background: isSel ? '#1a1a1a' : '#fff',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 200ms ease-out' }}>
                  {isSel && <svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3l3 3 4-5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>}
                </div>
              </div>
              <div onClick={() => onOpen(r)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 12, fontWeight: 500, color: '#1a1a1a', letterSpacing: '-0.36px', display: 'flex', alignItems: 'center' }}>{r.run}</div>
              <div onClick={() => onOpen(r)} style={{ fontSize: 13, color: '#1a1a1a', letterSpacing: '-0.005em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center' }}>{r.url}</div>
              <div onClick={() => onOpen(r)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, color: '#707070', letterSpacing: '-0.36px', display: 'flex', alignItems: 'center' }}>{r.date}</div>
              <div onClick={() => onOpen(r)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 13, fontWeight: 500, fontVariantNumeric: 'tabular-nums', display: 'flex', alignItems: 'center',
                color: r.score >= 60 ? '#ff4d2c' : r.score >= 45 ? '#707070' : '#3fb069' }}>{r.score}</div>
              <div onClick={() => onOpen(r)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, fontVariantNumeric: 'tabular-nums', display: 'flex', alignItems: 'center',
                color: r.delta > 0 ? '#ff4d2c' : '#3fb069' }}>{r.delta > 0 ? '+' : ''}{r.delta}</div>
              <div onClick={() => onOpen(r)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, color: '#707070', letterSpacing: '-0.36px', display: 'flex', alignItems: 'center' }}>{r.personas}体</div>
            </div>);

        })}
        {selected.length > 0 && selected.length < 2 &&
        <div style={{ marginTop: 12, fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, color: '#a8a8a8', letterSpacing: '-0.36px', textAlign: 'center' }}>
            もう 1 件選択すると A/B 比較できます
          </div>
        }
      </div>
    </div>);
}

/* ─── LEFT PANEL ─── */

    <div style={{ width: 288, borderRight: '1px solid #e8e8e8', display: 'flex', flexDirection: 'column', height: '100%', flexShrink: 0 }}>
      <div style={{ padding: '18px 22px 14px', borderBottom: '1px solid #e8e8e8', display: 'flex', alignItems: 'center', gap: 10 }}>
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="19" stroke="#1a1a1a" strokeWidth="1.5" />
          <circle cx="20" cy="20" r="8" fill="#ff4d2c" />
          <circle cx="12" cy="12" r="3" fill="#1a1a1a" opacity=".25" />
          <circle cx="28" cy="12" r="3" fill="#1a1a1a" opacity=".25" />
          <circle cx="12" cy="28" r="3" fill="#1a1a1a" opacity=".18" />
          <circle cx="28" cy="28" r="3" fill="#1a1a1a" opacity=".18" />
        </svg>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flex: 1 }}>
          <span style={{ fontSize: 15, fontWeight: 600, letterSpacing: '-0.01em' }}>GhostUsers</span>
          {phase === 'dynamic' && null}
        </div>
        <button onClick={onReports} title="Past reports"

function Step1({ config, onChange }) {

      name: f.name,
      url: URL.createObjectURL(f)

  return (
    <div>

            onDragLeave={() => setDragging(false)}
            onDrop={(e) => {e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}
            onClick={() => document.getElementById('img-upload-input').click()}
            style={{ border: `1.5px dashed ${dragging ? '#1a1a1a' : '#d4d4d4'}`, borderRadius: 10, padding: '20px 16px',

      <div>

        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {purposes.map((p) =>
          <button key={p.k} onClick={() => onChange({ purpose: p.k })} style={chip(config.purpose === p.k)}>{p.l}</button>
          )}
        </div>
      </div>
    </div>);

}

  /* ── SUGGESTED / CUSTOM PHASE ── */
  return (
    <div>

        { label: '性別', value: genderLabels[config.gender || 'balanced'],
          control: <div style={{ display: 'flex', gap: 4, background: '#f7f7f7', borderRadius: 500, padding: 3, display: 'inline-flex' }}>
            {['male-heavy', 'balanced', 'female-heavy'].map((g) => <button key={g} onClick={() => onChange({ gender: g })} style={{ ...pill((config.gender || 'balanced') === g), fontSize: 11, padding: '4px 10px' }}>{genderLabels[g]}</button>)}
          </div> },
        { label: 'IT リテラシー', value: litLabel[config.literacy] || '中',
          control: <div style={{ display: 'flex', gap: 4, background: '#f7f7f7', borderRadius: 500, padding: 3, display: 'inline-flex' }}>{literacies.map((l) => <button key={l.k} onClick={() => onChange({ literacy: l.k })} style={{ ...pill(config.literacy === l.k), fontSize: 11, padding: '4px 12px' }}>{l.l}</button>)}</div> },
        { label: '興味関心', value: (config.interests || []).slice(0, 3).join('・') || '未設定',
          control: <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', alignItems: 'center' }}>
            {INTERESTS_OPTIONS.map((t) => {const sel = (config.interests || []).includes(t);return <button key={t} onClick={() => toggleTag('interests', t)} style={{ ...chip(sel), fontSize: 10, padding: '3px 9px', display: 'flex', alignItems: 'center', gap: 3 }}>{sel && <span style={{ opacity: .6, fontSize: 9 }}>×</span>}{t}</button>;})
            }
            {(config.interests||[]).filter(t=>!INTERESTS_OPTIONS.includes(t)).map(t=>(
              <button key={t} onClick={()=>toggleTag('interests',t)} style={{...chip(true),fontSize:10,padding:'3px 9px',display:'flex',alignItems:'center',gap:3}}><span style={{opacity:.6,fontSize:9}}>×</span>{t}</button>
            ))}
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <input value={customInterest} onChange={e=>setCustomInterest(e.target.value)}
                placeholder='+追加' onKeyDown={e=>{if(e.key==='Enter'&&customInterest.trim()){toggleTag('interests',customInterest.trim());setCustomInterest('');}}}
                style={{border:'1px dashed #d4d4d4',borderRadius:4,padding:'3px 8px',fontSize:10,width:80,outline:'none',fontFamily:'Inter,「Noto Sans JP」,sans-serif',color:'#1a1a1a',background:'#fff'}}/>
              {customInterest.trim()&&<button onClick={()=>{toggleTag('interests',customInterest.trim());setCustomInterest('');}} style={{...chip(false),fontSize:10,padding:'3px 8px'}}>+</button>}
            </div>
          </div> },
        { label: '重視軸', value: (config.priorities || []).slice(0, 3).join('・') || '未設定',
          control: <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', alignItems: 'center' }}>
            {PRIORITY_OPTIONS.map((t) => {const sel = (config.priorities || []).includes(t);return <button key={t} onClick={() => toggleTag('priorities', t)} style={{ ...chip(sel), fontSize: 10, padding: '3px 9px', display: 'flex', alignItems: 'center', gap: 3 }}>{sel && <span style={{ opacity: .6, fontSize: 9 }}>×</span>}{t}</button>;})
            }
            {(config.priorities||[]).filter(t=>!PRIORITY_OPTIONS.includes(t)).map(t=>(
              <button key={t} onClick={()=>toggleTag('priorities',t)} style={{...chip(true),fontSize:10,padding:'3px 9px',display:'flex',alignItems:'center',gap:3}}><span style={{opacity:.6,fontSize:9}}>×</span>{t}</button>
            ))}
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <input value={customPriority} onChange={e=>setCustomPriority(e.target.value)}
                placeholder='+追加' onKeyDown={e=>{if(e.key==='Enter'&&customPriority.trim()){toggleTag('priorities',customPriority.trim());setCustomPriority('');}}}
                style={{border:'1px dashed #d4d4d4',borderRadius:4,padding:'3px 8px',fontSize:10,width:80,outline:'none',fontFamily:'Inter,「Noto Sans JP」,sans-serif',color:'#1a1a1a',background:'#fff'}}/>
              {customPriority.trim()&&<button onClick={()=>{toggleTag('priorities',customPriority.trim());setCustomPriority('');}} style={{...chip(false),fontSize:10,padding:'3px 8px'}}>+</button>}
            </div>
          </div> }].
        map((row) =>
        <div key={row.label} style={{ marginBottom: aiPhase === 'custom' ? 18 : 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: aiPhase === 'custom' ? 8 : 0 }}>
              <span style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, color: '#a8a8a8', letterSpacing: '-0.36px', width: 90, flexShrink: 0 }}>{row.label}</span>
              {aiPhase !== 'custom' && <span style={{ fontSize: 13, color: '#1a1a1a', letterSpacing: '-0.005em' }}>{row.value}</span>}
            </div>
            {aiPhase === 'custom' && row.control}
          </div>
        )}

        {aiPhase === 'custom' &&
        <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div>
              <div style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 6 }}>テキストで自由に指示を追加</div>
              <textarea
              placeholder="例: 20代女性を多めにして、ファッションへの関心が高いペルソナを追加してください。"
              rows={3}
              style={{ width: '100%', border: '1px solid #e8e8e8', borderRadius: 8, padding: '10px 14px', fontSize: 12,
                fontFamily: 'Inter,"Noto Sans JP",sans-serif', color: '#1a1a1a', resize: 'none',
                transition: 'border-color 200ms', background: '#fff', lineHeight: 1.6, letterSpacing: '-0.005em' }}
              onFocus={(e) => e.target.style.borderColor = '#1a1a1a'}
              onBlur={(e) => e.target.style.borderColor = '#e8e8e8'} />
            
            </div>
            <button
            onClick={() => {setUpdating(true);setTimeout(() => {onChange({ personasGenerated: true });setUpdating(false);}, 1600);}}
            disabled={updating}
            style={{ background: updating ? '#707070' : '#1a1a1a', color: '#fff', border: 'none', borderRadius: 500,
              padding: '10px 24px', fontSize: 12, fontWeight: 500, letterSpacing: '-0.26px', cursor: updating ? 'wait' : 'pointer',
              alignSelf: 'flex-start', transition: 'all 200ms', display: 'flex', alignItems: 'center', gap: 8 }}
            onMouseEnter={(e) => {if (!updating) e.currentTarget.style.opacity = '.8';}}
            onMouseLeave={(e) => e.currentTarget.style.opacity = '1'}>
              {updating && <span style={{ display: 'flex', gap: 3 }}>{[0, 1, 2].map((i) => <span key={i} style={{ width: 5, height: 5, borderRadius: '50%', background: '#fff', animation: `ghost-live-dot 1200ms ease-in-out ${i * 200}ms infinite`, display: 'inline-block' }} />)}</span>}
              {updating ? '生成中…' : 'ペルソナを更新'}
            </button>
          </div>
        }
      </div>
      {/* Persona preview removed — shown in sidebar */}
    </div>);

}

                letterSpacing: '-0.005em', whiteSpace: 'nowrap' }}>
                    {node.label}

                  {i < JM_NODES.length - 1 &&
              <div style={{ display: 'flex', alignItems: 'center', width: 24, flexShrink: 0 }}>

                      </svg>

                </React.Fragment>
            )}
            </div>
          </div>)
        }
      </div>
      <div style={{ marginBottom: 24 }}>
        <label style={{ fontSize: 12, fontWeight: 500, color: '#1a1a1a', letterSpacing: '-0.005em', display: 'block', marginBottom: 8 }}>テストタスク <span style={{ fontSize: 11, color: '#a8a8a8', fontWeight: 400 }}>（ペルソナへの指示）</span></label>
        <textarea value={config.taskDesc} onChange={(e) => onChange({ taskDesc: e.target.value })}
        placeholder="例: 商品を検索して購入フローを最後まで試してください。"
        rows={3}
        style={{ width: '100%', border: '1px solid #e8e8e8', borderRadius: 8, padding: '12px 16px', fontSize: 13, resize: 'none',
          fontFamily: 'Inter,"Noto Sans JP",sans-serif', color: '#1a1a1a', transition: 'border-color 200ms', background: '#fff', lineHeight: 1.6 }}
        onFocus={(e) => e.target.style.borderColor = '#1a1a1a'} onBlur={(e) => e.target.style.borderColor = '#e8e8e8'} />
      </div>
      {/* KPI */}
      <div style={{ marginBottom: 24 }}>

                style={{ width: 70, border: '1px solid #e8e8e8', borderRadius: 6, padding: '8px 10px', fontSize: 14,
                  fontFamily: '"IBM Plex Mono",monospace', color: '#1a1a1a', outline: 'none', transition: 'border-color 200ms',
                  fontVariantNumeric: 'tabular-nums', textAlign: 'right' }}
                onFocus={e=>e.target.style.borderColor='#1a1a1a'} onBlur={e=>e.target.style.borderColor='#e8e8e8'} />
              <span style={{ fontSize: 14, color: '#707070', fontWeight: 500 }}>%</span>
              <span style={{ fontSize: 11, color: '#a8a8a8', letterSpacing: '-0.005em' }}>以上</span>

    </div>);

}

function SetupPanel({ step, config, onChange, onNext, onBack, onRun }) {
  const [aiPhase, setAiPhase] = useState('input');
  const [prompt, setPrompt] = useState('');
  const canNext1 = config.device && config.purpose && (
  config.targetType === 'image' ?
  (config.uploadedImages || []).length > 0 :
  config.url && config.url.startsWith('http'));
  const canNext2 = config.personaCount > 0 && (config.ageGroups || []).length > 0;
  return (
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
      {/* Wizard center */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '40px 56px' }}>
        <StepIndicator step={step} />
        {step === 1 && <Step1 config={config} onChange={onChange} />}
        {step === 2 && <Step2 config={config} onChange={onChange} aiPhase={aiPhase} setAiPhase={setAiPhase} prompt={prompt} setPrompt={setPrompt} />}
        {step === 3 && <Step3 config={config} onChange={onChange} onRun={onRun} />}
        {step < 3 &&
        <div style={{ display: 'flex', gap: 10, marginTop: 32 }}>
            {step > 1 && <button onClick={onBack} style={{ ...chip(false), padding: '10px 20px', fontSize: 13 }}>← 戻る</button>}
            <button onClick={() => {if (step === 1 ? canNext1 : canNext2) onNext();}}
          style={{ background: (step === 1 ? canNext1 : canNext2) ? '#1a1a1a' : '#e8e8e8', color: (step === 1 ? canNext1 : canNext2) ? '#fff' : '#a8a8a8',
            border: 'none', borderRadius: 500, padding: '10px 28px', fontSize: 13, fontWeight: 500, letterSpacing: '-0.26px',
            cursor: (step === 1 ? canNext1 : canNext2) ? 'pointer' : 'not-allowed', transition: 'all 200ms ease-out' }}>
              次へ →
            </button>
          </div>
        }
        {step === 3 && <button onClick={onBack} style={{ ...chip(false), padding: '8px 16px', fontSize: 12, marginTop: 12 }}>← ペルソナ設定に戻る</button>}
      </div>
      {/* Right: help / preview */}
      <div style={{ width: 300, borderLeft: '1px solid #e8e8e8', overflowY: 'auto', padding: '32px 24px', flexShrink: 0 }}>
        <div style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 10, fontWeight: 500, color: '#a8a8a8', letterSpacing: '-0.36px', marginBottom: 16 }}>GUIDE</div>
        {step === 1 && <div style={{ fontSize: 12, color: '#707070', lineHeight: 1.7, letterSpacing: '-0.005em' }}>
          <p style={{ marginBottom: 12 }}>本番環境の URL、Figma プロトタイプ、またはステージング環境を入力してください。</p>
          <p style={{ marginBottom: 12 }}>デバイスを選択すると、そのデバイスに適した解像度でペルソナが操作を行います。</p>
          <p>検証目的を設定すると、ペルソナの行動傾向が自動的に最適化されます。</p>
        </div>}
        {step === 2 && <div style={{ fontSize: 12, color: '#707070', lineHeight: 1.7, letterSpacing: '-0.005em' }}>
          <p style={{ marginBottom: 12 }}>多様なペルソナ属性を設定することで、より広範なユーザー層の反応を検証できます。</p>
          <p style={{ marginBottom: 12 }}>年齢層は複数選択可能です。ターゲットユーザーの属性に合わせて選択してください。</p>
          <p>IT リテラシーが「低」のペルソナは、より慎重にナビゲーションを確認します。</p>
        </div>}
        {step === 3 && <div style={{ fontSize: 12, color: '#707070', lineHeight: 1.7, letterSpacing: '-0.005em' }}>
          <p style={{ marginBottom: 12 }}>タスク指示はペルソナへの「依頼」として機能します。具体的な行動を記述してください。</p>
          <p>検証開始後は Scan & Override ボタンでいつでも結果レポートに切り替えられます。</p>
        </div>}
      </div>
    </div>);

}

const EM_LINES = [

const EM_TIMES = ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', '12:00', '14:32'];

function EmotionChart() {
  const W = 440,H = 100,pL = 28,pR = 8,pT = 8,pB = 18;
  const cW = W - pL - pR,cH = H - pT - pB;
  const N = EM_DATA.positive.length;
  const gx = (i) => (pL + i / (N - 1) * cW).toFixed(1);
  const gy = (v) => (pT + (1 - v / 100) * cH).toFixed(1);
  const path = (vals) => vals.map((v, i) => `${i === 0 ? 'M' : 'L'} ${gx(i)} ${gy(v)}`).join(' ');
  const tIdxs = [0, Math.round(N * 2 / 14), Math.round(N * 4 / 14), Math.round(N * 6 / 14), Math.round(N * 8 / 14), Math.round(N * 10 / 14), Math.round(N * 12 / 14), N - 1];
  return (
    <div style={{ border: '1px solid #e8e8e8', borderRadius: 12, padding: '12px 14px', flexShrink: 0 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: '#1a1a1a', letterSpacing: '-0.005em', marginBottom: 8 }}>リアルタイム・感情推移</div>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 8 }}>
        {EM_LINES.map((l) =>
        <div key={l.key} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: l.color, flexShrink: 0 }} />
            <span style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 9, color: '#707070', letterSpacing: '-0.3px' }}>{l.label} {l.pct}%</span>
          </div>
        )}
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', overflow: 'visible' }}>
        {[0, 50, 100].map((v) =>
        <React.Fragment key={v}>
            <line x1={pL} y1={gy(v)} x2={W - pR} y2={gy(v)} stroke="#e8e8e8" strokeWidth="1" />
            <text x={pL - 4} y={parseFloat(gy(v)) + 3.5} textAnchor="end" fontSize="9" fill="#a8a8a8" fontFamily="IBM Plex Mono,monospace">{v}</text>
          </React.Fragment>
        )}
        {EM_LINES.map((l) =>
        <path key={l.key} d={path(EM_DATA[l.key])} fill="none" stroke={l.color} strokeWidth="1.5" strokeLinejoin="round" />
        )}
        {tIdxs.map((i, j) =>
        <text key={j} x={gx(i)} y={H - 1} textAnchor="middle" fontSize="9" fill="#a8a8a8" fontFamily="IBM Plex Mono,monospace">{EM_TIMES[j]}</text>
        )}
      </svg>
    </div>);

}

/* ─── MINI CHART ─── */
function MiniChart({ liveScore }) {
  const runs = [...CHART_RUNS, { label: '#249', score: liveScore ?? 65 }];
  const W = 272,H = 88,pX = 28,pY = 10,cW = W - pX * 2,cH = H - pY * 2 - 14,mn = 20,mx = 80;
  const pts = runs.map((r, i) => ({ x: pX + i / (runs.length - 1) * cW, y: pY + (1 - (r.score - mn) / (mx - mn)) * cH, ...r }));
  const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  return (
    <svg width={W} height={H} style={{ display: 'block', overflow: 'visible' }}>
      {[40, 60, 80].map((v) => {const y = pY + (1 - (v - mn) / (mx - mn)) * cH;return <React.Fragment key={v}>
        <line x1={pX} y1={y} x2={W - pX} y2={y} stroke="#e8e8e8" strokeWidth="1" />
        <text x={pX - 4} y={y + 3.5} textAnchor="end" fontSize="9" fill="#a8a8a8" fontFamily='"IBM Plex Mono",monospace'>{v}</text>
      </React.Fragment>;})}
      <path d={d} fill="none" stroke="#ff4d2c" strokeWidth="1.5" strokeLinejoin="round" />
      {pts.map((p, i) => <React.Fragment key={i}>
        <circle cx={p.x} cy={p.y} r={i === pts.length - 1 ? 4 : 2.5} fill={i === pts.length - 1 ? '#ff4d2c' : '#fff'} stroke="#ff4d2c" strokeWidth="1.5" />
        <text x={p.x} y={H - 1} textAnchor="middle" fontSize="9" fill="#a8a8a8" fontFamily='"IBM Plex Mono",monospace'>{p.label}</text>
      </React.Fragment>)}
    </svg>);

}

      <div style={{ padding: '0 28px 12px', display: 'flex', gap: 4 }}>
          {TABS.map((t) =>
        <button key={t.k} onClick={() => setCenterTab(t.k)} style={{ fontFamily: '"IBM Plex Mono",monospace', fontSize: 11, fontWeight: 500, letterSpacing: '-0.36px', padding: '5px 14px', borderRadius: 500, border: 'none', cursor: 'pointer', transition: 'all 200ms ease-out', background: centerTab === t.k ? '#1a1a1a' : 'transparent', color: centerTab === t.k ? '#fff' : '#707070' }}>{t.l}</button>
        )}
        </div>
      }
    </div>);

}

/* ─── APP ─── */
function App() {
  const [phase, setPhase] = useState('idle');
  const [scanning, setScanning] = useState(false);
  const [setupStep, setSetupStep] = useState(1);
  const [config, setConfig] = useState({ url: '', device: 'mobile', purpose: '', personaCount: 12, ageGroups: ['30代', '40代'], literacy: 'medium', taskDesc: '', targetType: 'url', uploadedImages: [], gender: 'balanced', interests: [], priorities: [], personasGenerated: false, kpiCompletion: 80, kpiScore: 40 });
  const [logs, setLogs] = useState([]);
  const [centerTab, setCenterTab] = useState('score');
  const [liveScore, setLiveScore] = useState(72);
  const [commentary, setCommentary] = useState(false);
  const timer = useRef(null);

  const updateConfig = useCallback((patch) => setConfig((p) => ({ ...p, ...patch })), []);

  useEffect(() => {
    if (phase !== 'dynamic') return;
    setLogs(LOGS.slice(0, 2));let idx = 2;
    timer.current = setInterval(() => {if (idx >= LOGS.length) {clearInterval(timer.current);return;}setLogs((p) => [...p, LOGS[idx++]]);}, 2500);
    return () => clearInterval(timer.current);
  }, [phase]);

  useEffect(() => {
    if (phase !== 'dynamic') return;
    setLiveScore(72);
    const t = setInterval(() => setLiveScore((p) => p > 64 ? p - 1 : p), 600);
    return () => clearInterval(t);
  }, [phase]);

  const handleScan = useCallback(() => {
    if (scanning || phase !== 'dynamic') return;
    setScanning(true);
    setTimeout(() => {setScanning(false);setPhase('static');setCenterTab('score');}, 820);
  }, [scanning, phase]);

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', position: 'relative' }}>
      {scanning && <div className="scan-overlay"><div className="scan-line" /></div>}
      <LeftPanel phase={phase} url={config.url} setUrl={(u) => updateConfig({ url: u })}
      onNew={() => {setPhase('setup');setSetupStep(1);}} config={config}
      onReports={() => setPhase((p) => p === 'reports' ? 'idle' : 'reports')} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <Header phase={phase} centerTab={centerTab} setCenterTab={setCenterTab} onScan={handleScan} setupStep={setupStep} commentary={commentary} setCommentary={setCommentary} />
        {/* REPORTS */}
        {phase === 'reports' &&
        <ReportsView
          onOpen={() => setPhase('static')}
          onNew={() => {setPhase('setup');setSetupStep(1);}} />
        }
        {/* SETUP */}
        {phase === 'setup' &&
        <SetupPanel step={setupStep} config={config} onChange={updateConfig}
        onNext={() => setSetupStep((s) => s + 1)} onBack={() => setSetupStep((s) => s - 1)}
        onRun={() => {setPhase('dynamic');}} />
        }
        {/* DASHBOARD */}
        {phase !== 'setup' && phase !== 'reports' &&
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {/* ── IDLE: empty main for later image/video ── */}
            {phase === 'idle' && <div style={{ flex: 1 }} />}
            {/* ── RUNNING / STATIC: 2-column ── */}
            {phase !== 'idle' && <>
            <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
              {phase === 'dynamic' && <LiveJourneyMap config={config} />}
              {phase === 'static' && centerTab === 'score' && <ScoreHero />}
              {phase === 'static' && centerTab === 'heatmap' && <Heatmap />}
              {phase === 'static' && centerTab === 'graveyard' && <Graveyard />}
              {phase === 'static' && centerTab === 'growth' && <GrowthView />}
            </div>
            <div style={{ width: 340, borderLeft: '1px solid #e8e8e8', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              {phase === 'dynamic' && <DynamicRight logs={logs} liveScore={liveScore} />}
              {phase === 'static' && <StaticRight visible />}
            </div>
            </>}
          </div>
        }
      </div>
    </div>);

}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
